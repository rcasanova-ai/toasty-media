<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Treasure Map | SHIPWREKT Assessment</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061316;color:#e8f8f6;font:16px/1.6 system-ui,sans-serif}header{border-bottom:1px solid #215354;background:#071d20}main,header>div{max-width:900px;margin:auto;padding:25px}header a{color:#35e6d3;text-decoration:none;font-weight:900}h1{font-size:clamp(2rem,5vw,3.8rem);margin:20px 0 10px}h2{margin:30px 0 15px;color:#35e6d3}h3{margin:8px 0}p{color:#c3d9d8}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:#35e6d3;font-weight:800;font-size:.8rem}.panel{background:#0c2528;border:1px solid #29565a;border-radius:14px;padding:25px;margin:20px 0}.finding{padding:20px 0;border-bottom:1px solid #28565a}.finding:last-child{border:0}.severity{text-transform:uppercase;color:#ffb778;font-size:.8rem;font-weight:900}.button{display:inline-block;background:#35e6d3;color:#062022;padding:13px 20px;border:0;border-radius:8px;font-weight:850;text-decoration:none;cursor:pointer;margin:8px 8px 8px 0}.button.alt{background:transparent;color:#e8f8f6;border:1px solid #528587}.metric{display:inline-block;background:#12393c;border:1px solid #296667;border-radius:8px;padding:10px 14px;margin:5px}.muted{font-size:.88rem;color:#9bb7b6}@media print{body{background:#fff;color:#111;font-size:11pt}header{background:#fff;color:#111;border-color:#ddd}header a{color:#087e75}.panel{background:#fff;color:#111;border:1px solid #bbb;break-inside:avoid}h2,.eyebrow{color:#087e75}p{color:#333}.button,.print-hidden{display:none!important}main{max-width:100%;padding:8px}.finding{break-inside:avoid}header>div{max-width:100%}} </style></head><body><header><div><a href="/shipwrekt/">☠ SHIPWREKT | White Hats. Black Flags.</a> <span style="float:right;color:#8cc7c0">WHITE HATS · BLACK FLAGS</span></div></header><main><p class="eyebrow">The Treasure Map · Confidential to your browser</p><h1>Your assessment report</h1><div id="report"><p>Loading your report...</p></div><a class="button alt" href="/shipwrekt/#scan-tool">← Back to the Lookout</a></main><script>(function(){const root=document.getElementById('report');function e(tag,t,cls){const x=document.createElement(tag);if(t!==undefined)x.textContent=String(t);if(cls)x.className=cls;return x;}let payload;try{payload=JSON.parse(localStorage.getItem('shipwrekt-latest-report')||'null');localStorage.removeItem('shipwrekt-latest-report');}catch(_){}if(!payload||!payload.data||Date.now()>payload.expires){root.replaceChildren(e('p','No recent report found. Run a new assessment from the Lookout.'));return;}const d=payload.data,fs=d.findings||[];root.replaceChildren();const summary=e('section',undefined,'panel');summary.append(e('p',d.product,'eyebrow'),e('h2',d.target||d.repository),e('p','Assessment date: '+d.checked_at),e('span',fs.length+' observations','metric'));if(d.http_status)summary.append(e('span','HTTP '+d.http_status,'metric'));if(d.recent_commits!==undefined)summary.append(e('span',d.recent_commits+' recent commits','metric'));root.append(summary);if(d.personalized){const p=d.personalized,box=e('section',undefined,'panel');box.append(e('p','A word from the crow’s nest','eyebrow'),e('h2',p.cheeky_comment),e('p',p.observation),e('p',p.deeper_assessment));const a=e('a','Explore deeper assessments →','button');a.href='/shipwrekt/#packages';box.append(a);root.append(box);}if(d.discoverability){const box=e('section',undefined,'panel');box.append(e('h2','Search & AI answer visibility'));box.append(e('p','These are basic on-page SEO and AEO/GEO readiness signals, not search rankings or proof of AI citation.'));const labels={page_title_present:'Descriptive page title',meta_description_present:'Meta description',canonical_present:'Canonical link',h1_present:'Main heading',structured_data_jsonld_present:'JSON-LD structured data',open_graph_title_present:'Open Graph title',mobile_viewport_present:'Mobile viewport'};for(const [key,label]of Object.entries(labels))box.append(e('p',(d.discoverability[key]?'✓ ':'○ ')+label));root.append(box);}if(d.copy_profile){const cp=d.copy_profile,box=e('section',undefined,'panel');box.append(e('h2','Writing-pattern analysis'));box.append(e('p',cp.score===null?'Not enough text for a useful index.':'Formulaic copy-pattern index: '+cp.score+'/100'));box.append(e('p',cp.scale));box.append(e('p','Sample: '+cp.word_count+' words. '+cp.disclaimer));if(cp.matched_phrases.length)box.append(e('p','Observed stock phrases: '+cp.matched_phrases.join(', ')));root.append(box);}const categories=[['security','Security & technical safeguards'],['visibility','AI visibility, SEO & discoverability'],['trust','Privacy, terms & trust'],['content','Content quality & AI-writing hallmarks']];for(const [cat,title] of categories){const group=fs.filter(f=>(f.category||'security')===cat);const panel=e('section',undefined,'panel');panel.append(e('h2',title),e('p',group.length+' observations'));if(!group.length)panel.append(e('p','No flagged issues in the limited checks performed. This is not a security clearance.'));for(const f of group){const item=e('article',undefined,'finding');item.append(e('span',f.severity,'severity'),e('h3',f.title),e('p',f.evidence),e('p','Captain’s Orders: '+f.recommendation));panel.append(item);}root.append(panel);}if(d.public_checks){const x=d.public_checks,box=e('section',undefined,'panel');box.append(e('h2','Public discovery signals'));box.append(e('p','robots.txt: HTTP '+x.robots_txt_status+' | sitemap.xml: HTTP '+x.sitemap_xml_status));box.append(e('p','Privacy policy discovered: '+(x.privacy_discovered?'Yes':'Not in limited checks')));box.append(e('p','Terms discovered: '+(x.terms_discovered?'Yes':'Not in limited checks')));box.append(e('p','AI content detection: We cannot reliably establish AI authorship. We flag only identifiable generic marketing phrases.'));root.append(box);}const limits=e('section',undefined,'panel');limits.append(e('h2','What we did not test'));for(const l of d.limitations||[])limits.append(e('p',l));root.append(limits);const b=e('button','Download JSON report','button');b.addEventListener('click',()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='shipwrekt-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});root.append(b);const pdf=e('button','Save branded PDF','button');pdf.addEventListener('click',()=>window.print());root.append(pdf);const agent=e('button','Copy fixes for your AI coding agent','button alt');agent.addEventListener('click',async()=>{const prompt=['You are helping improve my website '+(d.target||d.repository)+'.','These are evidence-backed SHIPWREKT assessment observations. Verify each against the current code before editing. Do not invent missing vulnerabilities. Do not alter production without my approval.',''];for(const f of fs)prompt.push('['+(f.category||'security')+'] '+f.title+'\nEvidence: '+f.evidence+'\nSuggested fix: '+f.recommendation+'\n');prompt.push('Implement safe changes with tests. Explain any limitations, policy considerations or required approvals.');try{await navigator.clipboard.writeText(prompt.join('\n'));agent.textContent='Copied! Paste into your coding agent.';}catch(err){agent.textContent='Clipboard unavailable. Use the JSON report instead.';}});root.append(agent);})();</script></body></html>
