<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Accept your Peeps invitation</title><link rel="icon" href="../../shared/brand/toasty-media/ToastyTransparent.png"><link rel="stylesheet" href="../peeps.css?v=20261008w1">
<style>
[hidden]{display:none!important}.wl{max-width:480px;margin:0 auto;padding:24px 16px 64px}.wl h1{font:900 clamp(30px,8vw,42px)/1 'Libre Franklin',Arial;letter-spacing:-.04em}.wl form{display:grid;gap:14px}.wl label{display:grid;gap:6px;font-size:13px;font-weight:800}.wl input{font:inherit;font-size:16px;padding:13px 12px;border:1px solid var(--line);border-radius:10px;min-height:48px;width:100%}.wl .msg{padding:12px 14px;border-radius:10px;font-size:14px}.wl .msg[data-state=error]{background:#fbe9e7;color:var(--red)}</style></head><body><header><a class="brand" href="../"><img src="../../shared/brand/toasty-media/ToastyTransparent.png" alt="Toasty"><span><b>TOASTY</b><em>PEEPS</em></span></a></header>
<main class="wl"><div id="jnLoading"><p class="muted">Checking your invitation…</p></div>
<div id="jnForm" hidden><h1>Welcome to Peeps</h1><p class="muted" id="jnIntro"></p><form id="jnFormEl"><label id="jnPwLabel">Choose a password <small>(10+ characters)</small><input id="jnPassword" type="password" minlength="10" autocomplete="new-password"></label><button type="submit" id="jnSubmit">Accept invitation</button></form><p id="jnMessage" class="msg" role="status" hidden></p></div>
<div id="jnBad" hidden><h1>Invitation unavailable</h1><p id="jnBadText" class="muted"></p><a class="button" href="../waitlist/">Join the waitlist</a></div>
<div id="jnDone" hidden><h1>You're in</h1><p class="muted" id="jnDoneText"></p><a class="button" id="jnGo" href="../app/">Open Peeps</a></div></main>
<script type="module" src="../../js/peeps-join-page.js?v=20261008w1"></script></body></html>
