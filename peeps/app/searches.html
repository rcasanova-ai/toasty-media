<!doctype html><html><head><script>document.documentElement.classList.add("peeps-app-gated");</script><style>html.peeps-app-gated body{visibility:hidden}</style><noscript><meta http-equiv="refresh" content="0;url=/peeps/"></noscript><script type="module" src="../../js/peeps-app-gate.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Requests · Toasty Peeps</title><link rel="stylesheet" href="../peeps.css"></head><body><div class="app-shell"><aside class="side"><a class="side-brand" href="./"><img src="../../shared/brand/toasty-media/ToastyTransparent.png"><span class="wordmark"><b>TOASTY</b><em>Peeps</em></span></a><nav><a href="./">Find Peeps</a><a class="active" href="./searches.html">My Requests</a><a href="./jams.html">My Jams</a><a href="./calendar.html">Calendar</a><a href="./demand.html">Demand</a><a href="./dub.html">My Dub</a><a href="./profile.html">My Profile</a><a href="./dough.html">Dough</a></nav></aside><main class="workspace">
<div class="section-head"><div><span class="eyebrow">Who you asked for, what Peeps found</span><h2>My Requests</h2></div><a class="btn" href="./">New request</a></div>
<section class="table" id="requestsTable">
  <div class="row head"><span>Who</span><span>Outcome</span><span>Status</span><span></span></div>
  <div class="row"><span class="muted">Loading your requests…</span></div>
</section>
</main></div>
<script type="module">
import { getPrimaryOrganizationId, listPeepsRequests } from "../../js/peeps-jam-api.js";

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const STATUS_LABEL = {
  researching: "Researching", candidates_ready: "Candidates ready", introductions_authorized: "Introductions sent",
  booked: "Booked", completed: "Completed"
};

function renderRequests(requests) {
  const table = document.getElementById("requestsTable");
  const head = `<div class="row head"><span>Who</span><span>Outcome</span><span>Status</span><span></span></div>`;
  if (!requests.length) {
    table.innerHTML = `${head}<div class="row"><span class="muted">No requests yet. Tell Peeps who you want to talk to.</span></div>`;
    return;
  }
  const rows = requests.map((r) => `
    <div class="row">
      <strong>${escapeHtml((r.whoText || "").slice(0, 60))}</strong>
      <span class="muted">${escapeHtml((r.outcomeText || "").slice(0, 60))}</span>
      <span><i class="tag${["introductions_authorized", "booked", "completed"].includes(r.status) ? " good" : ""}">${STATUS_LABEL[r.status] || r.status}</i></span>
      <span><a class="link" href="./request.html?id=${encodeURIComponent(r.id)}">Open →</a></span>
    </div>`).join("");
  table.innerHTML = head + rows;
}

async function load() {
  const organizationId = await getPrimaryOrganizationId();
  if (!organizationId) { renderRequests([]); return; }
  const result = await listPeepsRequests(organizationId);
  renderRequests(result.requests || []);
}

load().catch((error) => {
  document.getElementById("requestsTable").innerHTML = `<div class="row"><span class="muted">Could not load requests: ${escapeHtml(error.message || "")}</span></div>`;
});
</script>
</body></html>
