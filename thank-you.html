<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Granted — The Eloquence Protocol</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #e8e0d0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 40px 30px;
      border: 1px solid rgba(200,169,110,0.2);
      background: #111;
    }

    h1 {
      font-family: 'Cinzel', serif;
      color: #C8A96E;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    p {
      font-size: 14px;
      color: #888880;
      margin-bottom: 30px;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 20px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #C8A96E, transparent);
      margin: 25px 0;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Access Granted</h1>

    <div class="divider"></div>

    <p>
      Your materials have been sent to your email.
    </p>

    <p>
      Open your inbox and download your files.
    </p>

    <div class="divider"></div>

    <p class="note">
      If you don’t see it, check spam or promotions.
    </p>
  </div>

</body>
</html>
