<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event — Toasty</title>
    <link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{color-scheme:dark}
      *{box-sizing:border-box}
      body{margin:0;font-family:var(--brand-body-font,Inter,system-ui,sans-serif);background:var(--brand-background,#0b0908);color:var(--brand-text,#f4ead9)}
      .ep-preview-banner{background:#f9c46b;color:#1b0f08;text-align:center;font-weight:800;padding:8px;font-size:13px}
      .ep-hero{padding:64px 20px 40px;text-align:center;background:var(--brand-surface,#171210)}
      .ep-hero img.hero-img{max-width:640px;width:100%;border-radius:16px;margin:0 auto 24px;display:block}
      .ep-hero h1{font-family:var(--brand-heading-font,Manrope,sans-serif);font-size:clamp(28px,5vw,44px);margin:0 0 12px}
      .ep-hero p{color:var(--brand-text-muted,#9c8d7c);font-size:17px;max-width:640px;margin:0 auto}
      .ep-meta{margin-top:18px;font-size:14px;color:var(--brand-text-muted,#9c8d7c)}
      .ep-body{max-width:760px;margin:0 auto;padding:40px 20px}
      .ep-section{margin-bottom:36px}
      .ep-section h2{font-family:var(--brand-heading-font,Manrope,sans-serif);font-size:20px;margin:0 0 14px}
      .ep-desc{white-space:pre-wrap;line-height:1.7;color:var(--brand-text,#f4ead9)}
      .ep-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
      .ep-person{background:var(--brand-surface,#171210);border:1px solid var(--brand-border,rgba(255,255,255,.1));border-radius:12px;padding:16px}
      .ep-person img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin-bottom:10px;background:var(--brand-surface-alt,#201815)}
      .ep-person strong{display:block}
      .ep-person small{color:var(--brand-text-muted,#9c8d7c)}
      .ep-sponsors{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
      .ep-sponsors a{display:flex;align-items:center;gap:10px;background:var(--brand-surface,#171210);border:1px solid var(--brand-border,rgba(255,255,255,.1));border-radius:10px;padding:10px 16px;color:inherit;text-decoration:none}
      .ep-sponsors img{height:28px}
      .ep-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}
      .ep-btn{display:inline-block;padding:14px 28px;border-radius:999px;font-weight:800;text-decoration:none;background:var(--brand-button,#ff7a29);color:var(--brand-button-text,#1c0f06)}
      .ep-btn.secondary{background:transparent;border:1px solid var(--brand-border,rgba(255,255,255,.2));color:var(--brand-text,#f4ead9)}
      .ep-replay-note{color:var(--brand-text-muted,#9c8d7c);font-size:14px}
      .ep-share{color:var(--brand-text-muted,#9c8d7c);font-size:13px;text-align:center;padding:20px}
      .ep-error{max-width:520px;margin:80px auto;text-align:center;padding:0 20px}
    </style>
  </head>
  <body>
    <div id="epPreviewBanner" class="ep-preview-banner" hidden>PREVIEW — this page is not published. Only you can see this.</div>
    <main id="epRoot">
      <div class="ep-error"><p>Loading event…</p></div>
    </main>
    <script type="module" src="../js/event-page-renderer.js"></script>
  </body>
</html>
