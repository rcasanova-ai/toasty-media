<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plan Session — Toasty Studio</title>
    <link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png">
    <link rel="stylesheet" href="../css/expertise-platform.css">
    <link rel="stylesheet" href="../css/event-growth.css">
    <style>
      .plan-shell{min-height:100vh;background:#0d0c0b;display:grid;grid-template-columns:250px 1fr;color:#f7f3ed}
      .plan-side{padding:26px 18px;border-right:1px solid #2a2622;display:flex;flex-direction:column;gap:4px}
      .plan-side a{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:24px;color:inherit}
      .plan-side a img{height:30px}
      .plan-step-btn{border:0;background:transparent;color:#948b82;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between}
      .plan-step-btn[hidden]{display:none}
      .plan-step-btn.active{background:#201c18;color:#fff}
      .plan-step-btn .n{color:#5f574e}
      .plan-main{padding:36px 4vw 80px;max-width:820px}
      .plan-main h1{font:800 30px Montserrat,sans-serif;margin:4px 0 22px}
      .plan-field{display:grid;gap:6px;margin-bottom:16px}
      .plan-field label{font-size:12px;font-weight:700;color:#c9bfb5;text-transform:uppercase;letter-spacing:.04em}
      .plan-field input,.plan-field textarea,.plan-field select{background:#151310;border:1px solid #2e2924;color:#eee;border-radius:10px;padding:11px 12px;font:inherit}
      .plan-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
      .plan-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
      .plan-check{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
      .plan-actions{display:flex;justify-content:space-between;margin-top:28px}
      .plan-list-item{background:#151310;border:1px solid #2b2723;border-radius:14px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
      .plan-list-item strong{display:block}
      .plan-list-item small{color:#8f857b}
      .plan-pill{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#221d19;color:#c9bfb4}
      .plan-pill.good{background:#17241d;color:#8fd4ae}
      .plan-pill.warn{background:#2a2118;color:#f1bc83}
      .plan-readiness-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#151310;border:1px solid #2b2723;border-radius:12px;margin-bottom:8px}
      .plan-status{font-size:13px;color:#8f857b;margin-top:10px;min-height:18px}
      .plan-status.err{color:#e58686}
      .plan-btn-small{padding:8px 14px;font-size:13px}
      .plan-side-label{margin:18px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8f857b}
      .plan-step-btn--minor{opacity:.85}
      .plan-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}
      .plan-type-card{text-align:left;background:#151310;border:1px solid #2e2924;border-radius:14px;padding:18px;color:#eee;cursor:pointer;display:grid;gap:6px;font:inherit}
      .plan-type-card:hover,.plan-type-card.active{border-color:#ff7a29}
      .plan-type-card small{color:#8f857b}
      .plan-brief-section{border:1px solid #2b2723;border-radius:12px;padding:14px;margin-bottom:12px}
      .plan-review section{border:1px solid #2b2723;border-radius:14px;padding:18px;margin-bottom:14px;background:#151310}
      .plan-review-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
      .plan-review h2,.plan-review h3{margin:0}.plan-review h4{margin:14px 0 4px;font-size:13px;color:#c9bfb5}
      .plan-guest{border-top:1px solid #2b2723;padding-top:14px;margin-top:14px}
      @media (max-width:760px){.plan-shell{grid-template-columns:1fr}.plan-side{border-right:0;border-bottom:1px solid #2a2622;padding:14px 16px}.plan-side nav{display:flex;flex-wrap:wrap;gap:4px}.plan-side-label{width:100%}.plan-grid-2,.plan-grid-3{grid-template-columns:1fr}.plan-main{padding:22px 16px 60px}}
    </style>
  </head>
  <body>
    <div class="plan-shell">
      <aside class="plan-side">
        <a href="./index.html"><img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="Toasty"></a>
        <nav id="stepNav">
          <button class="plan-step-btn" data-step="type"><span>Session type</span><span class="n">1</span></button>
          <button class="plan-step-btn" data-step="basics"><span>Session information</span><span class="n">2</span></button>
          <button class="plan-step-btn" data-step="episode" data-episode-step hidden><span>Episode and show</span><span class="n">2b</span></button>
          <button class="plan-step-btn" data-step="story" data-episode-step hidden><span>Story map</span><span class="n">2c</span></button>
          <button class="plan-step-btn" data-step="speakers"><span>Guests</span><span class="n">3</span></button>
          <button class="plan-step-btn" data-step="hostprep"><span>Your preparation</span><span class="n">4</span></button>
          <button class="plan-step-btn" data-step="invite"><span>Invite guests</span><span class="n">5</span></button>
          <button class="plan-step-btn" data-step="review"><span>Review the plan</span><span class="n">6</span></button>
          <p class="plan-side-label">More options</p>
          <a class="plan-step-btn plan-step-btn--minor" href="./shows.html" style="margin:0"><span>Shows and seasons</span></a>
          <button class="plan-step-btn plan-step-btn--minor" data-step="audience"><span>Audience and event</span></button>
          <button class="plan-step-btn plan-step-btn--minor" data-step="sponsors"><span>Sponsors</span></button>
          <button class="plan-step-btn plan-step-btn--minor" data-step="assets"><span>Assets</span></button>
          <button class="plan-step-btn plan-step-btn--minor" data-step="readiness"><span>Readiness check</span></button>
        </nav>
      </aside>
      <main class="plan-main" id="planMain">
        <p>Loading planner…</p>
      </main>
    </div>
    <script type="module" src="../js/session-planner-page.js"></script>
  </body>
</html>
