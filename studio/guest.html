<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Toasty Studio</title>
    <link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&family=Montserrat:wght@700;800;900&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/brand.css">
    <link rel="stylesheet" href="../css/studio.css">
    <link rel="stylesheet" href="../css/studio-white-label.css">
    <link rel="stylesheet" href="../css/studio-shell-v2.css">
    <script type="module" src="../js/guest.js"></script>
  </head>
  <body class="studio-shell guest-shell">
    <main class="guest-grid">
      <header class="guest-topbar">
        <a class="brand-lockup brand-lockup--compact" id="studioBrandLink" href="../site/" aria-label="Studio brand home">
          <img
            id="studioBrandLogo"
            src="../shared/brand/toasty-media/ToastyMediaStudio.png"
            alt="Toasty Media Studio"
          >
          <span class="brand-text-lockup" id="studioBrandText" hidden>Toasty Studio</span>
        </a>
        <div class="guest-topbar-status">
          <span class="powered-by" id="poweredBy">
            <span>Powered by</span>
            <img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="Toasty Media Studio">
          </span>
          <span class="guest-status-chip" id="joinState">Not joined</span>
        </div>
      </header>

      <div id="guestCheckin">
        <section class="guest-join-card" aria-label="Join Studio">
          <p class="eyebrow" id="guestRoomEyebrow">Guest check-in · <span id="guestRoomLabel">Guest room</span></p>

          <div class="preview-stage" id="previewStage" data-background="none">
            <video id="cameraPreview" autoplay muted playsinline></video>
            <div class="preview-overlay">
              <img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="" data-brand-logo>
            </div>
          </div>

          <label>
            <span>Name</span>
            <input id="guestName" type="text" autocomplete="name" placeholder="Your name" required>
          </label>

          <div class="guest-device-row">
            <label>
              <span>Camera</span>
              <select id="cameraSelect"></select>
            </label>
            <label>
              <span>Microphone</span>
              <select id="microphoneSelect"></select>
            </label>
          </div>

          <!-- INSTRUMENTATION BUILD — see js/guest.js's window.__toastyGuestJoinDiagnostic. A real Android
               device reported "tap Join, nothing visibly happens" even though a simulated click in this
               session's own browser harness worked — this panel exists to answer, from a phone screenshot
               alone with no devtools, exactly which of: stale build / JS never loaded / button disabled /
               something overlaying the button / the tap never firing / joinStudio throwing, is real. Remove
               this whole block plus its wiring once a real device confirms which one it was and it's fixed. -->
          <div class="toasty-debug-panel" id="toastyDebugPanel" aria-live="polite">
            <p class="toasty-debug-title">DEBUG (temporary)</p>
            <div id="toastyDebugFields"></div>
          </div>

          <button
            id="joinStudio"
            class="btn btn-primary full-width"
            type="button"
            onclick="window.__toastyGuestJoinDiagnostic(event)"
          >Join Studio</button>
          <p class="control-note" id="guestStatus">Camera preview starts locally before joining. No account required.</p>

          <details class="guest-pro-details">
            <summary>Add professional details ▾</summary>
            <label>
              <span>Title</span>
              <input id="guestTitleField" type="text" autocomplete="organization-title" placeholder="e.g. CEO">
            </label>
            <label>
              <span>Company</span>
              <input id="guestCompany" type="text" autocomplete="organization" placeholder="e.g. Acme Inc.">
            </label>
            <label>
              <span>Logo (optional)</span>
              <input id="guestLogoUpload" type="file" accept="image/*">
            </label>
            <div>
              <p class="bg-picker-label">Background</p>
              <div class="bg-picker" role="radiogroup" aria-label="Background">
                <button type="button" class="bg-swatch" data-background="none" aria-pressed="true">No background</button>
                <button type="button" class="bg-swatch" data-background="blur" aria-pressed="false">Blur</button>
                <button type="button" class="bg-swatch" data-background="newsroom" aria-pressed="false">Newsroom</button>
                <button type="button" class="bg-swatch" data-background="library" aria-pressed="false">Library</button>
                <button type="button" class="bg-swatch" data-background="stage" aria-pressed="false">Fireside stage</button>
              </div>
            </div>
          </details>
        </section>

        <!-- TEMPORARY real-device diagnostics — mirrors js/prejoin-diagnostics.js's Host pattern. Remove
             this block and its wiring in js/guest.js once real publish confirmation is verified on
             hardware for both a phone guest and the desktop's own view of that guest. -->
        <div class="lv-prejoin-diag">
          <p class="lv-prejoin-diag-title">Guest connection diagnostics (temporary)</p>
          <div class="lv-prejoin-diag-log" id="guestDiagLog"></div>
        </div>
      </div>

      <!-- Transport-only: VDO.Ninja's guest push/publish connection lives here, never as visible product
           UI — see js/guest.js's joinStudio. Kept permanently off-screen (not display:none) so the encoder
           isn't throttled for being hidden, same as the Host's #lvHostTransportFrame. -->
      <div class="lv-hidden-transport" id="guestTransportFrame" aria-hidden="true"></div>

      <section class="joined-room" id="joinedRoom" hidden aria-label="Live guest room">
        <div class="guest-live-identity" id="guestLiveIdentity">
          <span class="guest-live-identity-name" id="guestLiveIdentityName"></span>
          <span class="guest-live-identity-role" id="guestLiveIdentityRole"></span>
        </div>
        <div class="guest-live-controls">
          <button id="guestToggleMic" class="dock-btn" type="button" aria-pressed="false" title="Mute mic">
            <span class="dock-icon dock-icon-on" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></span>
            <span class="dock-icon dock-icon-off" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></span>
            <span class="dock-label sr-only">Mute mic</span>
          </button>
          <button id="guestToggleCamera" class="dock-btn" type="button" aria-pressed="false" title="Camera off">
            <span class="dock-icon dock-icon-on" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></span>
            <span class="dock-icon dock-icon-off" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"></path><path d="M9 5h5a2 2 0 0 1 2 2v5"></path><polygon points="23 7 16 12 23 17 23 7"></polygon><line x1="1" y1="1" x2="23" y2="23"></line></svg></span>
            <span class="dock-label sr-only">Camera off</span>
          </button>
          <button id="guestFlipCamera" class="dock-btn" type="button" title="Flip camera" hidden>
            <span class="dock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 23l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></span>
            <span class="dock-label sr-only">Flip camera</span>
          </button>
          <button id="guestToggleScreen" class="dock-btn" type="button" aria-pressed="false" title="Share screen">
            <span class="dock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></span>
            <span class="dock-label sr-only">Share screen</span>
          </button>
          <button id="guestEndSession" class="dock-btn dock-btn-danger" type="button" title="Leave">
            <span class="dock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1-1a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17.72V21a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 3h3.28a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11z"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg></span>
            <span class="dock-label sr-only">Leave</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
