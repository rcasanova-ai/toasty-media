<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Page — Toasty Studio</title>
    <link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png">
    <link rel="stylesheet" href="../css/expertise-platform.css">
    <link rel="stylesheet" href="../css/event-growth.css">
    <style>
      .plan-shell{min-height:100vh;background:#0d0c0b;display:grid;grid-template-columns:250px 1fr;color:#f7f3ed}
      .plan-side{padding:26px 18px;border-right:1px solid #2a2622;display:flex;flex-direction:column;gap:4px}
      .plan-side a{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:24px;color:inherit;text-decoration:none}
      .plan-side a img{height:30px}
      .plan-side nav a{color:#948b82;padding:10px 14px;border-radius:10px;font-size:14px}
      .plan-side nav a.active{background:#201c18;color:#fff}
      .plan-main{padding:36px 4vw 80px;max-width:820px}
      .plan-main h1{font:800 30px Montserrat,sans-serif;margin:4px 0 6px}
      .plan-main .sub{color:#8f857b;margin:0 0 22px;font-size:14px}
      .plan-field{display:grid;gap:6px;margin-bottom:16px}
      .plan-field label{font-size:12px;font-weight:700;color:#c9bfb5;text-transform:uppercase;letter-spacing:.04em}
      .plan-field input,.plan-field textarea,.plan-field select{background:#151310;border:1px solid #2e2924;color:#eee;border-radius:10px;padding:11px 12px;font:inherit}
      .plan-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
      .plan-section-title{font-weight:800;color:#e8ded4;margin:26px 0 10px;font-size:15px}
      .plan-list-item{background:#151310;border:1px solid #2b2723;border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
      .plan-list-item label{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
      .plan-pill{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#221d19;color:#c9bfb4}
      .plan-pill.good{background:#17241d;color:#8fd4ae}
      .plan-pill.warn{background:#2a2118;color:#f1bc83}
      .plan-actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap;gap:10px}
      .plan-status{font-size:13px;color:#8f857b;margin-top:10px;min-height:18px}
      .plan-status.err{color:#e58686}
      .plan-status.ok{color:#8fd4ae}
      .plan-btn-small{padding:8px 14px;font-size:13px}
      .readonly-box{background:#151310;border:1px solid #2b2723;border-radius:10px;padding:12px 14px;color:#c9bfb4;font-size:14px}
      .plan-hint{color:#8f857b;font-size:13px;margin:-8px 0 16px}
    </style>
  </head>
  <body>
    <div class="plan-shell">
      <aside class="plan-side">
        <a href="./index.html"><img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="Toasty"></a>
        <nav id="eventPageBack"></nav>
      </aside>
      <main class="plan-main" id="eventPageMain">
        <p>Loading Event Page…</p>
      </main>
    </div>
    <script type="module" src="../js/event-page-editor.js"></script>
  </body>
</html>
