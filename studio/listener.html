<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toasty Studio — Program Output</title>
    <link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/brand.css">
    <link rel="stylesheet" href="../css/program-output.css">
    <link rel="stylesheet" href="../css/studio-white-label.css">
    <link rel="stylesheet" href="../css/studio-shell-v2.css">
    <script type="module" src="../js/listener.js"></script>
  </head>
  <body class="program-output" data-scene="holding" data-layout="1">
    <div class="po-canvas" id="poCanvas">
      <header class="po-chrome po-chrome-top po-masthead" id="poChromeTop">
        <div class="po-brand">
          <img id="poBrandLogo" src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="">
        </div>
        <div class="po-masthead-text">
          <h1 class="po-masthead-headline" id="poHeadline"></h1>
          <p class="po-masthead-session" id="poSessionName" hidden></p>
        </div>
      </header>

      <main class="po-stage" id="poStage" data-layout="1"></main>

      <section class="po-scene-screen po-holding" id="poHolding">
        <div class="po-scene-mark">
          <img id="poHoldingLogo" src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="">
        </div>
        <p class="po-scene-kicker">Starting soon</p>
        <h1 class="po-scene-topic" id="poHoldingTopic">Toasty Studio</h1>
        <p class="po-scene-session" id="poHoldingSession" hidden></p>
      </section>

      <section class="po-scene-screen po-brb" id="poBrb" hidden>
        <div class="po-scene-mark">
          <img id="poBrbLogo" src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="">
        </div>
        <p class="po-scene-kicker">Be right back</p>
        <h1 class="po-scene-topic" id="poBrbTopic">We'll be right back</h1>
      </section>

      <!-- Producer-triggered "something broke" holding state — distinct from BRB (a planned break).
           Reversible immediately back to Live without losing session/participant state: this is a scene
           flag only, nothing here tears down presence, VDO transport, or Run of Show. Illustration is
           CSS-animated using ONLY existing Toasty mascot assets (no external/AI-generated image, no
           third-party IP) — see .po-technical-spark/.po-technical-smoke below for the asset-slot note if
           a bespoke illustration is ever commissioned. -->
      <section class="po-scene-screen po-technical" id="poTechnical" hidden>
        <div class="po-technical-rig" aria-hidden="true">
          <span class="po-technical-spark po-technical-spark--1"></span>
          <span class="po-technical-spark po-technical-spark--2"></span>
          <span class="po-technical-spark po-technical-spark--3"></span>
          <span class="po-technical-smoke"></span>
          <div class="po-scene-mark po-technical-mark">
            <img id="poTechnicalLogo" src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="">
          </div>
          <svg class="po-technical-wrench" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.7 19.3 15 11.6a5.5 5.5 0 0 0-6.9-6.9L11 7.6 7.6 11 4.7 8.1A5.5 5.5 0 0 0 11.6 15l7.7 7.7a1 1 0 0 0 1.4 0l2-2a1 1 0 0 0 0-1.4Z"/></svg>
        </div>
        <p class="po-scene-kicker">Technical difficulties</p>
        <h1 class="po-scene-topic" id="poTechnicalHeadline">Technical Difficulties</h1>
        <p class="po-technical-message" id="poTechnicalMessage">We're fixing something. Back shortly.</p>
      </section>

      <section class="po-scene-screen po-ending" id="poEnding" hidden>
        <div class="po-scene-mark">
          <img id="poEndingLogo" src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="">
        </div>
        <p class="po-scene-kicker">Thanks for watching</p>
        <h1 class="po-scene-topic" id="poEndingHeadline">Connect with Toasty Media</h1>
        <p class="po-ending-message" id="poEndingMessage" hidden></p>
        <p class="po-ending-website" id="poEndingWebsite" hidden></p>
        <div class="po-ending-socials" id="poEndingSocials" hidden></div>
        <div class="po-ending-qr" id="poEndingQr" hidden>
          <img id="poEndingQrImage" alt="Scan to connect">
        </div>
      </section>

      <footer class="po-chrome po-chrome-bottom" id="poChromeBottom">
        <span class="po-chip po-chip-live" id="poLiveChip">LIVE</span>
        <div class="po-ticker" id="poTicker" hidden>
          <div class="po-ticker-track" id="poTickerTrack"><span id="poTickerText"></span></div>
        </div>
        <div class="po-social-links" id="poSocialLinks" hidden></div>
      </footer>

      <span class="powered-by program-powered-by" id="programPoweredBy" hidden>
        <span>Powered by</span>
        <img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="Toasty Media Studio">
      </span>
    </div>
  </body>
</html>
