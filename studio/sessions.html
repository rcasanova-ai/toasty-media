<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio Sessions | Toasty Studio</title>
  <meta name="description" content="Sign in to manage your Toasty Studio sessions.">
  <link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/brand.css">
  <link rel="stylesheet" href="../css/studio-public.css">
  <link rel="stylesheet" href="../css/studio-white-label.css">
  <link rel="stylesheet" href="../css/studio-shell-v2.css">
  <style id="studio-entry-curtain-css">
    #studioEntryCurtain{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#0b0807;color:#fff4e5;font-family:Inter,system-ui,sans-serif;transition:opacity .22s ease,visibility .22s ease}#studioEntryCurtain.is-leaving{opacity:0;visibility:hidden;pointer-events:none}.entry-loading{text-align:center}.entry-brand{font:800 13px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#ff8a3d;margin-bottom:10px}.entry-copy{font:700 20px Inter,sans-serif}
  </style>
  <script type="module" src="../js/studio-auth.js"></script>
</head>
<body class="studio-public-shell studio-access-shell">
  <div id="studioEntryCurtain" role="status" aria-live="polite"><div class="entry-loading"><div class="entry-brand">Toasty Studio</div><div class="entry-copy">Opening your sessions...</div></div></div>

  <main id="studioPublicPage" class="studio-access-page" aria-live="polite">
    <a class="studio-access-brand" href="./">
      <img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="Toasty Media Studio">
    </a>

    <section class="studio-access-card" aria-labelledby="authTitle">
      <div class="studio-access-intro">
        <p>STUDIO ACCESS</p>
        <h1 id="authTitle">Welcome back.</h1>
        <span>Sign in to manage your sessions, guests, and recordings.</span>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Studio access">
        <button id="showLogin" class="auth-tab is-active" type="button" role="tab" aria-selected="true">Sign In</button>
        <button id="showSignup" class="auth-tab" type="button" role="tab" aria-selected="false">Create Account</button>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="on">
        <label>Email<input id="loginEmail" name="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="loginPassword" name="password" type="password" autocomplete="current-password" required></label>
        <button class="public-button" type="submit">Sign In</button>
      </form>

      <form id="signupForm" class="auth-form" autocomplete="on" hidden>
        <label>Name<input id="signupName" name="name" autocomplete="name" required></label>
        <label>Email<input id="signupEmail" name="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="10" required></label>
        <button class="public-button" type="submit">Create Account</button>
      </form>

      <p id="authMessage" class="auth-message" role="status"></p>
    </section>

    <a class="studio-access-back" href="./">Back to Toasty Studio</a>
  </main>

  <span class="powered-by public-powered-by" id="publicPoweredBy" hidden><span>Powered by</span><img src="../shared/brand/toasty-media/ToastyMediaStudio.png" alt="Toasty Media Studio"></span>

  <section id="studioAppShell" class="studio-app-shell" hidden>
    <button id="studioLogout" class="studio-logout" type="button">Sign out</button>
    <iframe id="studioAppFrame" title="Studio application" src="about:blank" allow="camera; microphone; autoplay"></iframe>
  </section>
</body>
</html>
