<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Group Intelligence · Toasty Studio</title><link rel="stylesheet" href="../css/studio.css"><style>body{padding:28px;max-width:1200px;margin:auto}.fg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fg-card{border:1px solid rgba(0,0,0,.12);border-radius:16px;padding:20px;background:#fff}.fg-card pre{white-space:pre-wrap;font-size:12px}.fg-list{display:grid;gap:8px}.fg-item{padding:10px;border-radius:10px;background:#f5f5f5}.fg-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}@media(max-width:800px){.fg-grid{grid-template-columns:1fr}}</style></head><body><p class="eyebrow">Solo-testable focus group stack</p><h1>Focus Group Intelligence Demo</h1><p>This uses a seeded transcript so Hottie/research extraction and the delivery pack can be tested without live participants.</p><div class="fg-actions"><button id="run">Analyze seeded session</button><button id="download">Download delivery JSON</button></div><section class="fg-grid"><article class="fg-card"><h2>Moderator prompts</h2><div id="prompts" class="fg-list"></div></article><article class="fg-card"><h2>Top findings</h2><div id="findings" class="fg-list"></div></article><article class="fg-card"><h2>Transcript evidence</h2><div id="quotes" class="fg-list"></div></article><article class="fg-card"><h2>Research gaps</h2><div id="gaps" class="fg-list"></div></article></section><article class="fg-card" style="margin-top:16px"><h2>Delivery manifest</h2><pre id="manifest"></pre></article><script type="module">
import{createFocusGroupContext,buildFocusGroupDeliveryPack}from'../js/focus-group.js';
const context=createFocusGroupContext({title:'Hackathon Product Focus Group',objective:'Understand whether the onboarding and value proposition are clear enough to try the product.',researchQuestions:['What do participants think the product does?','What is confusing during onboarding?','Would they try it and why or why not?'],cohort:{size:5,description:'Mobile-first Bangkok consumers, ages 25–45'}});
const lines=[
{speaker:'Nok',text:'I like the idea, but I am not sure what happens after I press continue.',timestamp:1000},
{speaker:'Ben',text:'The first screen is clear to me and I would probably try it.',timestamp:2000},
{speaker:'May',text:'I thought it was a payment app at first, so the wording is confusing.',timestamp:3000},
{speaker:'Nok',text:'The setup feels a little complicated. I would use it if it was faster.',timestamp:4000},
{speaker:'Arun',text:'I like the result screen. That is where I finally understand why this is useful.',timestamp:5000},
{speaker:'Ben',text:'I would not pay before I saw the value once.',timestamp:6000},
{speaker:'May',text:'The price matters less than whether I trust what happens with my data.',timestamp:7000}
];
let pack=null;
function render(){pack=buildFocusGroupDeliveryPack(lines,context);document.querySelector('#prompts').innerHTML=pack.moderatorPrompts.map(x=>`<div class="fg-item"><b>${x.type}</b><br>${x.text}</div>`).join('')||'None';document.querySelector('#findings').innerHTML=pack.topFindings.map(x=>`<div class="fg-item"><b>${x.signal}</b> · ${x.count}<br><small>${x.evidence[0]?.text||''}</small></div>`).join('')||'None';document.querySelector('#quotes').innerHTML=pack.notableQuotes.map(x=>`<div class="fg-item"><b>${x.speaker}</b> · ${x.signal}<br>“${x.quote}”</div>`).join('')||'None';document.querySelector('#gaps').innerHTML=pack.unansweredQuestions.map(x=>`<div class="fg-item">${x.question}</div>`).join('')||'No obvious gaps';document.querySelector('#manifest').textContent=JSON.stringify(pack,null,2)}
document.querySelector('#run').onclick=render;document.querySelector('#download').onclick=()=>{if(!pack)render();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}));a.download='toasty-focus-group-delivery.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
