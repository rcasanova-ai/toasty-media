name: Deploy render helper and Node server

# Copies scripts/toasty-auth-db.py AND scripts/render-production-server.mjs onto the
# Ubuntu render host, then restarts toasty-render if either hash changed.
# Presence/control-plane routes live in the Node server; Python alone cannot ship them.
# Also ships the scripts/human-presence/ feature directory (hash-compared, backed up) and syncs the repo's
# marked "toasty-managed" nginx blocks into the live nginx config (nginx -t, reload, automatic rollback), then
# makes sure the human presence flags exist in the service env file in admin only test mode (never overriding a
# value someone already set). Does not touch the SQLite DB, broadcast, or any other part of the env file.
on:
  workflow_dispatch:
    inputs:
      production_smoke:
        description: Run the Toasty Talks production audition smoke test
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/toasty-auth-db.py"
      - "scripts/render-production-server.mjs"
      - "scripts/human-presence/**"
      - "scripts/nginx-render.conf.example"
      - "scripts/sync-nginx-managed-block.py"
      - "scripts/locate-nginx-config.sh"
      - "scripts/creator-broadcast-test.mjs"
      - "scripts/studio-broadcast-server-test.mjs"
      - "scripts/studio-mode-model-test.mjs"
      - "scripts/recording-jobs-server-test.mjs"
      - "scripts/recording-recovery-test.mjs"
      - "scripts/studio-waitlist-server-test.mjs"
      - "scripts/talk-audition-server-test.mjs"
      - "scripts/waitlist-stats-server-test.mjs"
      - ".github/workflows/deploy-render-helper.yml"

concurrency:
  group: toasty-render-helper
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server and cost-safety regression
        run: |
          set -euo pipefail
          node --check scripts/render-production-server.mjs
          node scripts/creator-broadcast-test.mjs
          node scripts/cost-safety-architecture-test.mjs

      - name: Validate Studio Backstage / Record / Live model
        run: |
          set -euo pipefail
          node scripts/studio-mode-model-test.mjs
          node scripts/master-program-recording-test.mjs

      - name: Install ffmpeg for broadcast and MP4 tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate Studio broadcast backend (real ffmpeg, real RTMP sink, sustained past proxy window)
        run: |
          set -euo pipefail
          node scripts/studio-broadcast-server-test.mjs
          node scripts/recording-finalization-mp4-test.mjs
          node scripts/recording-jobs-server-test.mjs
          node scripts/recording-recovery-test.mjs
          node scripts/studio-waitlist-server-test.mjs
          node scripts/talk-audition-server-test.mjs

      - name: Validate live Studio stability
        run: |
          set -euo pipefail
          node scripts/live-studio-stability-test.mjs

      - name: Run Studio release gate
        run: |
          set -euo pipefail
          node scripts/studio-release-gate.mjs

      - name: Validate onboarding and End Session
        run: |
          set -euo pipefail
          node scripts/onboarding-end-session-test.mjs

      - name: Validate platform admin founder controls
        run: |
          set -euo pipefail
          node --check js/platform-admin.js
          python3 -m py_compile scripts/toasty-auth-db.py
          node scripts/platform-admin-test.mjs

      - name: Validate AI usage analytics
        run: |
          set -euo pipefail
          node scripts/ai-usage-analytics-test.mjs

      - name: Validate public Peeps roast Dub
        run: |
          set -euo pipefail
          node scripts/peeps-josip-roast-test.mjs

      - name: Validate Peeps public waitlist
        run: |
          set -euo pipefail
          node scripts/peeps-waitlist-server-test.mjs
          node scripts/peeps-zcash-settlement-server-test.mjs

      - name: Validate human presence feature and managed nginx sync
        run: |
          set -euo pipefail
          node scripts/human-presence-core-test.mjs
          node scripts/human-presence-server-test.mjs
          node scripts/nginx-managed-block-test.mjs
          node scripts/nginx-route-coverage-test.mjs

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOASTY_RENDER_SSH_PRIVATE_KEY || secrets.TOASTY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "No TOASTY_RENDER_SSH_PRIVATE_KEY or TOASTY_SSH_PRIVATE_KEY secret is set." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/toasty_render_deploy
          chmod 600 ~/.ssh/toasty_render_deploy
          ssh-keyscan -p 22 -H 165.22.57.61 >> ~/.ssh/known_hosts

      - name: Inspect render unit and helper
        id: inspect
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===== systemctl cat toasty-render.service ====='
          systemctl cat toasty-render.service
          echo '===== is-active ====='
          systemctl is-active toasty-render.service || true
          echo '===== env helper/path hints ====='
          if [[ -f /etc/toasty-render.env ]]; then
            echo 'HAS /etc/toasty-render.env'
            grep -E '^(TOASTY_AUTH_DB_HELPER|TOASTY_AUTH_DB|TOASTY_RENDER_PORT|TOASTY_RENDER_HOST)=' /etc/toasty-render.env || true
          else
            echo 'NO /etc/toasty-render.env'
          fi
          echo '===== process cwd ====='
          systemctl show toasty-render.service -p WorkingDirectory -p ExecStart -p EnvironmentFiles -p FragmentPath --no-pager
          REMOTE

      - name: Sync helper and Node server if hashes differ
        env:
          WL_TOKEN: ${{ secrets.TOASTY_WAITLIST_STATS_TOKEN }}
        run: |
          set -euo pipefail
          LOCAL_HELPER_HASH="$(sha256sum scripts/toasty-auth-db.py | awk '{print $1}')"
          LOCAL_NODE_HASH="$(sha256sum scripts/render-production-server.mjs | awk '{print $1}')"
          echo "Git helper sha256=$LOCAL_HELPER_HASH"
          echo "Git node   sha256=$LOCAL_NODE_HASH"
          INSPECT="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'bash -s' <<'REMOTE'
          set -euo pipefail
          WD="$(systemctl show -p WorkingDirectory --value toasty-render.service)"
          EXEC="$(systemctl show -p ExecStart --value toasty-render.service)"
          ENVFILES="$(systemctl show -p EnvironmentFiles --value toasty-render.service)"
          HELPER=""
          NODE=""
          if [[ -f /etc/toasty-render.env ]]; then
            HELPER="$(grep -E '^TOASTY_AUTH_DB_HELPER=' /etc/toasty-render.env | tail -n1 | cut -d= -f2- | tr -d "\"'" || true)"
          fi
          if [[ -z "$HELPER" && -n "$WD" && -f "$WD/scripts/toasty-auth-db.py" ]]; then
            HELPER="$WD/scripts/toasty-auth-db.py"
          fi
          if [[ -z "$HELPER" && -f /opt/toasty-render/scripts/toasty-auth-db.py ]]; then
            HELPER=/opt/toasty-render/scripts/toasty-auth-db.py
          fi
          if [[ "$EXEC" == *render-production-server.mjs* ]]; then
            NODE="$(printf '%s\n' "$EXEC" | grep -oE '/[^ ]*render-production-server\.mjs' | head -n1 || true)"
          fi
          if [[ -z "$NODE" && -n "$HELPER" && -f "$(dirname "$HELPER")/render-production-server.mjs" ]]; then
            NODE="$(dirname "$HELPER")/render-production-server.mjs"
          fi
          if [[ -z "$NODE" && -n "$WD" && -f "$WD/scripts/render-production-server.mjs" ]]; then
            NODE="$WD/scripts/render-production-server.mjs"
          fi
          echo "WD=$WD"
          echo "EXEC=$EXEC"
          echo "ENVFILES=$ENVFILES"
          echo "HELPER=$HELPER"
          echo "NODE=$NODE"
          if [[ -n "$HELPER" && -f "$HELPER" ]]; then
            echo "HELPER_HASH=$(sha256sum "$HELPER" | awk '{print $1}')"
          else
            echo "HELPER_HASH=MISSING"
          fi
          if [[ -n "$NODE" && -f "$NODE" ]]; then
            echo "NODE_HASH=$(sha256sum "$NODE" | awk '{print $1}')"
          else
            echo "NODE_HASH=MISSING"
          fi
          REMOTE
          )"
          echo "$INSPECT"
          REMOTE_HELPER="$(printf '%s\n' "$INSPECT" | awk -F= '/^HELPER=/{print substr($0,8)}')"
          REMOTE_NODE="$(printf '%s\n' "$INSPECT" | awk -F= '/^NODE=/{print substr($0,6)}')"
          REMOTE_HELPER_HASH="$(printf '%s\n' "$INSPECT" | awk -F= '/^HELPER_HASH=/{print $2}')"
          REMOTE_NODE_HASH="$(printf '%s\n' "$INSPECT" | awk -F= '/^NODE_HASH=/{print $2}')"
          if [[ -z "$REMOTE_HELPER" || "$REMOTE_HELPER" == *..* || "${REMOTE_HELPER:0:1}" != "/" ]]; then
            echo "Refusing to copy: could not resolve an absolute helper path" >&2
            exit 1
          fi
          if [[ "$(basename "$REMOTE_HELPER")" != "toasty-auth-db.py" ]]; then
            echo "Refusing to overwrite $REMOTE_HELPER" >&2
            exit 1
          fi
          if [[ -z "$REMOTE_NODE" || "$REMOTE_NODE" == *..* || "${REMOTE_NODE:0:1}" != "/" ]]; then
            echo "Refusing to copy: could not resolve an absolute Node server path" >&2
            exit 1
          fi
          if [[ "$(basename "$REMOTE_NODE")" != "render-production-server.mjs" ]]; then
            echo "Refusing to overwrite $REMOTE_NODE" >&2
            exit 1
          fi
          echo "REMOTE_HELPER=$REMOTE_HELPER" >> "$GITHUB_ENV"
          echo "REMOTE_NODE=$REMOTE_NODE" >> "$GITHUB_ENV"
          echo "LOCAL_HELPER_HASH=$LOCAL_HELPER_HASH" >> "$GITHUB_ENV"
          echo "LOCAL_NODE_HASH=$LOCAL_NODE_HASH" >> "$GITHUB_ENV"
          NEED_RESTART=false
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          if [[ "$REMOTE_HELPER_HASH" != "$LOCAL_HELPER_HASH" ]]; then
            echo "Helper hash mismatch (remote=$REMOTE_HELPER_HASH local=$LOCAL_HELPER_HASH). Copying helper."
            ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "set -euo pipefail; if [[ -f '$REMOTE_HELPER' ]]; then cp -a '$REMOTE_HELPER' '$REMOTE_HELPER.bak-$STAMP'; fi"
            scp -P 22 -i ~/.ssh/toasty_render_deploy -o BatchMode=yes scripts/toasty-auth-db.py "root@165.22.57.61:$REMOTE_HELPER"
            NEED_RESTART=true
          else
            echo "Helper hashes already match."
          fi
          if [[ "$REMOTE_NODE_HASH" != "$LOCAL_NODE_HASH" ]]; then
            echo "Node hash mismatch (remote=$REMOTE_NODE_HASH local=$LOCAL_NODE_HASH). Copying Node server."
            ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "set -euo pipefail; if [[ -f '$REMOTE_NODE' ]]; then cp -a '$REMOTE_NODE' '$REMOTE_NODE.bak-$STAMP'; fi"
            scp -P 22 -i ~/.ssh/toasty_render_deploy -o BatchMode=yes scripts/render-production-server.mjs "root@165.22.57.61:$REMOTE_NODE"
            NEED_RESTART=true
          else
            echo "Node hashes already match."
          fi
          # ---- Human presence feature directory (imported by render-production-server.mjs) ----
          REMOTE_DIR="$(dirname "$REMOTE_NODE")/human-presence"
          LOCAL_HP_HASH="$(cd scripts/human-presence && find . -type f \( -name '*.mjs' -o -name '*.py' \) | sort | xargs sha256sum | sha256sum | awk '{print $1}')"
          REMOTE_HP_HASH="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "if [[ -d '$REMOTE_DIR' ]]; then cd '$REMOTE_DIR' && find . -type f \\( -name '*.mjs' -o -name '*.py' \\) | sort | xargs sha256sum | sha256sum | awk '{print \$1}'; else echo MISSING; fi")"
          echo "REMOTE_HP_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"
          echo "LOCAL_HP_HASH=$LOCAL_HP_HASH" >> "$GITHUB_ENV"
          if [[ "$REMOTE_HP_HASH" != "$LOCAL_HP_HASH" ]]; then
            echo "Human presence dir differs (remote=$REMOTE_HP_HASH local=$LOCAL_HP_HASH). Copying."
            ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "set -euo pipefail; if [[ -d '$REMOTE_DIR' ]]; then cp -a '$REMOTE_DIR' '$REMOTE_DIR.bak-$STAMP'; fi; mkdir -p '$REMOTE_DIR'"
            tar -C scripts/human-presence --exclude=__pycache__ -cf - . | ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "set -euo pipefail; tar -C '$REMOTE_DIR' -xf -"
            NEED_RESTART=true
          else
            echo "Human presence dir already matches."
          fi
          # ---- Service env: human presence flags, admin only test mode. Only appends keys that are absent. ----
          ENV_CHANGED="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'bash -s' <<'ENVSCRIPT'
          set -euo pipefail
          F=/etc/toasty-render.env
          if [[ ! -f "$F" ]]; then echo "NOFILE"; exit 0; fi
          changed=no
          for kv in HUMAN_PRESENCE_ENABLED=1 HUMAN_PRESENCE_ADMIN_ONLY=1 HUMAN_PRESENCE_PEEPS_ENABLED=1; do
            k="${kv%%=*}"
            if ! grep -qE "^${k}=" "$F"; then
              [[ -n "$(tail -c1 "$F")" ]] && echo >> "$F"
              echo "$kv" >> "$F"
              changed=yes
            fi
          done
          echo "$changed"
          ENVSCRIPT
          )"
          echo "env flags changed: $ENV_CHANGED"
          # ---- Santati waitlist dashboard: stats token + opt-in signup ping. Idempotent; the token never appears in logs or argv. ----
          if [[ -n "${WL_TOKEN:-}" ]]; then
            WL_CHANGED="$(printf '%s\n' "$WL_TOKEN" | ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'set -euo pipefail; read -r T; F=/etc/toasty-render.env; [[ -f "$F" ]] || { echo NOFILE; exit 0; }; changed=no; upsert() { if grep -qxF "$1=$2" "$F"; then return 0; fi; { grep -v "^$1=" "$F" || true; } > "$F.tmp"; cat "$F.tmp" > "$F"; rm -f "$F.tmp"; if [[ -n "$(tail -c1 "$F")" ]]; then echo >> "$F"; fi; echo "$1=$2" >> "$F"; changed=yes; }; upsert TOASTY_WAITLIST_STATS_TOKEN "$T"; upsert SANTATI_WAITLIST_PING_URL https://santaticrm.com/crm-api.php; echo "$changed"')"
            echo "waitlist env changed: $WL_CHANGED"
            if [[ "$WL_CHANGED" == "yes" ]]; then NEED_RESTART=true; fi
          fi
          if [[ "$ENV_CHANGED" == "yes" ]]; then NEED_RESTART=true; fi
          if [[ "$NEED_RESTART" == "true" ]]; then
            ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "set -euo pipefail; systemctl restart toasty-render.service; systemctl is-active toasty-render.service"
            echo "copied=true" >> "$GITHUB_ENV"
          else
            echo "Hashes already match. No copy, no restart."
            echo "copied=false" >> "$GITHUB_ENV"
          fi

      - name: Hash-verify and health
        run: |
          set -euo pipefail
          REMOTE_HELPER_HASH="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "sha256sum '$REMOTE_HELPER' | awk '{print \$1}'")"
          REMOTE_NODE_HASH="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "sha256sum '$REMOTE_NODE' | awk '{print \$1}'")"
          echo "remote helper sha256=$REMOTE_HELPER_HASH"
          echo "local  helper sha256=$LOCAL_HELPER_HASH"
          echo "remote node   sha256=$REMOTE_NODE_HASH"
          echo "local  node   sha256=$LOCAL_NODE_HASH"
          test "$REMOTE_HELPER_HASH" = "$LOCAL_HELPER_HASH"
          test "$REMOTE_NODE_HASH" = "$LOCAL_NODE_HASH"
          REMOTE_HP_NOW="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "cd '$REMOTE_HP_DIR' && find . -type f \\( -name '*.mjs' -o -name '*.py' \\) | sort | xargs sha256sum | sha256sum | awk '{print \$1}'")"
          echo "remote human-presence tree sha256=$REMOTE_HP_NOW"
          echo "local  human-presence tree sha256=$LOCAL_HP_HASH"
          test "$REMOTE_HP_NOW" = "$LOCAL_HP_HASH"
          if ! curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error https://render.toasty.media/health; then
            echo "===== toasty-render journal ====="
            ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'journalctl -u toasty-render.service -n 120 --no-pager || true; systemctl status toasty-render.service --no-pager || true'
            exit 1
          fi
          echo
          curl --fail --silent --show-error 'https://render.toasty.media/api/presence/room?roomId=tmu8te8yv1s7n0f'
          echo
          systemctl_status="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'systemctl is-active toasty-render.service')"
          echo "service=$systemctl_status"
          test "$systemctl_status" = "active"

      - name: Locate the live nginx config for render.toasty.media
        id: locate
        run: |
          set -euo pipefail
          scp -P 22 -i ~/.ssh/toasty_render_deploy -o BatchMode=yes scripts/locate-nginx-config.sh "root@165.22.57.61:/tmp/locate-nginx-config.sh"
          set +e
          OUTPUT="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "bash /tmp/locate-nginx-config.sh")"
          STATUS=$?
          set -e
          if [[ $STATUS -ne 0 || "$OUTPUT" != FOUND:* ]]; then
            echo "Could not locate the live nginx config file." >&2
            exit 1
          fi
          echo "file_path=${OUTPUT#FOUND:}" >> "$GITHUB_OUTPUT"

      - name: Sync managed nginx blocks (backup, nginx -t, reload, auto-rollback)
        run: |
          set -euo pipefail
          REMOTE="${{ steps.locate.outputs.file_path }}"
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "cat '$REMOTE'" > /tmp/live-nginx.conf
          python3 scripts/sync-nginx-managed-block.py scripts/nginx-render.conf.example < /tmp/live-nginx.conf > /tmp/merged-nginx.conf
          if cmp -s /tmp/live-nginx.conf /tmp/merged-nginx.conf; then
            echo "Live nginx already matches the managed blocks. Nothing to do."
            exit 0
          fi
          diff -u /tmp/live-nginx.conf /tmp/merged-nginx.conf || true
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          scp -P 22 -i ~/.ssh/toasty_render_deploy -o BatchMode=yes /tmp/merged-nginx.conf "root@165.22.57.61:/tmp/nginx-managed-merge.conf"
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "REMOTE='$REMOTE' STAMP='$STAMP' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          NGINX_BIN="$(command -v nginx || true)"
          for candidate in "$NGINX_BIN" /usr/sbin/nginx /usr/bin/nginx /sbin/nginx; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then NGINX_BIN="$candidate"; break; fi
          done
          if [[ -z "$NGINX_BIN" ]]; then echo "No nginx binary found." >&2; exit 1; fi
          # Backups live outside sites-enabled/ so nginx's include glob can never pick them up.
          BACKUP_DIR="/root/nginx-jam-backups"
          mkdir -p "$BACKUP_DIR"
          BACKUP_PATH="$BACKUP_DIR/$(basename "$REMOTE").bak-$STAMP"
          cp -a "$REMOTE" "$BACKUP_PATH"
          cp /tmp/nginx-managed-merge.conf "$REMOTE"
          if "$NGINX_BIN" -t; then
            systemctl reload nginx
            echo "nginx -t passed; reloaded."
          else
            echo "nginx -t FAILED, restoring backup, NOT reloading." >&2
            cp -a "$BACKUP_PATH" "$REMOTE"
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Verify human presence routes reach the app and existing routes still work
        run: |
          set -euo pipefail
          CFG="$(curl -s -o /tmp/hp-config.json -w '%{http_code}' https://render.toasty.media/api/human-presence/config)"
          echo "GET /api/human-presence/config -> $CFG"
          cat /tmp/hp-config.json; echo
          test "$CFG" = "200"
          grep -q '"adminOnly":true' /tmp/hp-config.json
          HOST_STATUS="$(curl -s -o /dev/null -w '%{http_code}' https://render.toasty.media/api/sessions/ls_probe/human-presence)"
          echo "GET /api/sessions/:id/human-presence (anonymous) -> $HOST_STATUS (expect 401, never 404 from nginx)"
          test "$HOST_STATUS" = "401"
          ORG_STATUS="$(curl -s -o /dev/null -w '%{http_code}' https://render.toasty.media/api/organizations)"
          test "$ORG_STATUS" = "401"
          curl --fail --silent --show-error https://render.toasty.media/health

      - name: Production audition journey
        if: github.event_name == 'workflow_dispatch' && inputs.production_smoke
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 'set -a; source /etc/toasty-render.env; set +a; node --input-type=module -' < scripts/talk-audition-production-smoke.mjs
          echo
