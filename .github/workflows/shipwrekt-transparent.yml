name: Make SHIPWREKT artwork transparent
on:
  push:
    paths:
      - scripts/transparent-shipwrekt.py
      - .github/workflows/shipwrekt-transparent.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transparent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Remove white backgrounds from original logos
        run: python scripts/transparent-shipwrekt.py
      - name: Commit transparent PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shipwrekt/assets/*.png
          git diff --cached --quiet || (git commit -m 'shipwrekt: transparent original logo backgrounds' && git push)
