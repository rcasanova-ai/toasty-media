name: Inspect Cholo Whistle mirror

on:
  push:
    paths:
      - .github/workflows/deploy-exact-cholo.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect soundboard metadata
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -A "$UA" -L --fail \
            "https://soundboardbuttons.com/sound-tracks/whatsapp-soundboard/" \
            -o /tmp/page.html
          echo "=== cholo lines ==="
          grep -i -n -C 8 'cholo' /tmp/page.html || true
          echo "=== audio/mp3/data lines ==="
          grep -i -n -E 'mp3|audio|data-src|data-sound|download' /tmp/page.html | head -n 300 || true
