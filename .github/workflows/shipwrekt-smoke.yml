name: SHIPWREKT scanner smoke test
on:
  push:
    paths:
      - shipwrekt/api/scan.php
      - shipwrekt/index.html
      - shipwrekt/api/crows-nest-vote.php
      - shipwrekt/crew/index.php
      - .github/workflows/shipwrekt-smoke.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          set -e
          php -l shipwrekt/api/scan.php
          php -l shipwrekt/api/crows-nest-vote.php
          php -l shipwrekt/crew/index.php
      - name: Verify UI has both functional forms
        run: |
          grep -Fq 'id="lookoutForm"' shipwrekt/index.html
          grep -Fq 'id="repoForm"' shipwrekt/index.html
          grep -Fq '/shipwrekt/api/scan.php' shipwrekt/index.html
      - name: Wait for production publication
        run: sleep 15
      - name: Live free scan with response diagnostics
        run: |
          set -euo pipefail
          for target in 'https://toasty.media/' 'https://example.com/'; do
            payload=$(printf '{"mode":"lookout","url":"%s","authorized":true}' "$target")
            status=$(curl -sS --max-time 35 -o /tmp/lookout.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$payload" https://toasty.media/shipwrekt/api/scan.php)
            echo "Lookout target: $target; HTTP $status"
            python3 -c 'import json;d=json.load(open("/tmp/lookout.json"));print("Result:", {k:d.get(k) for k in ("ok","error","product","target","http_status")})'
            if [[ "$status" != 200 ]]; then echo "::error::Lookout returned HTTP $status"; exit 1; fi
            php -r '$d=json_decode(file_get_contents("/tmp/lookout.json"),true); if(empty($d["ok"])||!is_array($d["findings"]??null)||($d["product"]??"")!=="The Lookout")exit(1);'
          done
          status=$(curl -sS --max-time 35 -o /tmp/repo.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"mode":"repository","repository":"octocat/Hello-World","authorized":true}' https://toasty.media/shipwrekt/api/scan.php)
          echo "Repository assessment HTTP $status"
          python3 -c 'import json;d=json.load(open("/tmp/repo.json"));print("Result:", {k:d.get(k) for k in ("ok","error","product","repository")})'
          [[ "$status" == 200 ]]
          php -r '$d=json_decode(file_get_contents("/tmp/repo.json"),true); if(empty($d["ok"])||($d["repository"]??"")!=="octocat/Hello-World")exit(1);'
          echo 'Both SHIPWREKT production scans returned structured reports.'
