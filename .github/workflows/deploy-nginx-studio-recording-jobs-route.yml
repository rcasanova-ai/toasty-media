name: Sync Studio recording jobs nginx route to render host

# Adds the /api/recordings/jobs* location (streamed raw upload, no nginx request buffering, long timeouts for
# the upload only; conversion itself is a polled job). Idempotent; backup + nginx -t + auto-rollback.
on:
  workflow_dispatch:

concurrency:
  group: toasty-render-helper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOASTY_RENDER_SSH_PRIVATE_KEY || secrets.TOASTY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "No TOASTY_RENDER_SSH_PRIVATE_KEY or TOASTY_SSH_PRIVATE_KEY secret is set." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/toasty_render_deploy
          chmod 600 ~/.ssh/toasty_render_deploy
          ssh-keyscan -p 22 -H 165.22.57.61 >> ~/.ssh/known_hosts

      - name: Clean up any stray backup left in sites-enabled/ by an earlier failed attempt
        run: |
          set -euo pipefail
          # Same class of hazard documented in deploy-nginx-jam-routes.yml: a "*.bak-<timestamp>" file
          # left inside /etc/nginx/sites-enabled/ itself gets picked up by nginx's own
          # `include /etc/nginx/sites-enabled/*;` as a second enabled site. Only ever removes files
          # matching this repo's own naming convention, from that one directory.
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 \
            "find /etc/nginx/sites-enabled -maxdepth 1 -name '*.bak-*' -print -delete"

      - name: Locate the live nginx config file for render.toasty.media
        id: locate
        run: |
          set -euo pipefail
          scp -P 22 -i ~/.ssh/toasty_render_deploy -o BatchMode=yes scripts/locate-nginx-config.sh "root@165.22.57.61:/tmp/locate-nginx-config.sh"
          set +e
          OUTPUT="$(ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "bash /tmp/locate-nginx-config.sh")"
          STATUS=$?
          set -e
          if [[ $STATUS -ne 0 || "$OUTPUT" != FOUND:* ]]; then
            echo "Could not locate the live nginx config file — see DIAG lines above for what nginx -T actually reported." >&2
            exit 1
          fi
          FILE_PATH="${OUTPUT#FOUND:}"
          echo "Found: $FILE_PATH"
          echo "file_path=$FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build the merged config locally and verify the patch applies cleanly
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 \
            "cat '${{ steps.locate.outputs.file_path }}'" > /tmp/live-nginx.conf
          python3 scripts/sync-nginx-studio-recording-jobs-route.py scripts/nginx-render.conf.example \
            < /tmp/live-nginx.conf > /tmp/merged-nginx.conf
          echo "Diff of what will change on the live host:"
          diff -u /tmp/live-nginx.conf /tmp/merged-nginx.conf || true

      - name: Backup, apply, validate with nginx -t, reload (auto-rollback on any failure)
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          REMOTE="${{ steps.locate.outputs.file_path }}"
          scp -P 22 -i ~/.ssh/toasty_render_deploy -o BatchMode=yes /tmp/merged-nginx.conf "root@165.22.57.61:/tmp/nginx-studio-recording-jobs-merge.conf"
          ssh -i ~/.ssh/toasty_render_deploy -p 22 -o BatchMode=yes root@165.22.57.61 "REMOTE='$REMOTE' STAMP='$STAMP' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          NGINX_BIN="$(command -v nginx || true)"
          for candidate in "$NGINX_BIN" /usr/sbin/nginx /usr/bin/nginx /sbin/nginx; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then NGINX_BIN="$candidate"; break; fi
          done
          if [[ -z "$NGINX_BIN" ]]; then echo "No nginx binary found." >&2; exit 1; fi
          # Backup lives OUTSIDE sites-enabled/ — see deploy-nginx-jam-routes.yml's own comment on why a
          # sibling of the live file inside sites-enabled/ is unsafe (gets picked up as a second site).
          BACKUP_DIR="/root/nginx-jam-backups"
          mkdir -p "$BACKUP_DIR"
          BACKUP_PATH="$BACKUP_DIR/$(basename "$REMOTE").bak-$STAMP"
          cp -a "$REMOTE" "$BACKUP_PATH"
          cp /tmp/nginx-studio-recording-jobs-merge.conf "$REMOTE"
          if "$NGINX_BIN" -t; then
            systemctl reload nginx
            echo "nginx -t passed; reloaded."
          else
            echo "nginx -t FAILED — restoring backup, NOT reloading." >&2
            cp -a "$BACKUP_PATH" "$REMOTE"
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Verify — jobs route reaches the app (auth-gated); preflight allows the recording header
        run: |
          set -euo pipefail
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Toasty-CSRF: 1' https://render.toasty.media/api/recordings/jobs)"
          echo "POST recordings/jobs (anonymous) -> $STATUS"
          [[ "$STATUS" == "401" ]] || { echo "Expected 401 from the Node app; got $STATUS." >&2; exit 1; }
          LIMITS="$(curl -s -o /dev/null -w '%{http_code}' https://render.toasty.media/api/recordings/limits)"
          echo "GET recordings/limits (anonymous) -> $LIMITS"
          [[ "$LIMITS" == "401" ]] || { echo "Expected 401 for /api/recordings/limits; got $LIMITS (route not proxied)." >&2; exit 1; }
          HDRS="$(curl -s -D - -o /dev/null -X OPTIONS -H 'Origin: https://toasty.media' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: x-toasty-recording,x-toasty-csrf,content-type' https://render.toasty.media/api/recordings/jobs)"
          echo "$HDRS" | head -1
          echo "$HDRS" | grep -qi 'x-toasty-recording' || { echo "Preflight does not allow X-Toasty-Recording." >&2; exit 1; }
          curl --fail --silent --show-error https://render.toasty.media/health
          echo
          echo "Verification passed."
