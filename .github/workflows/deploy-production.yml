name: Deploy Toasty Production

on:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: Deploy every tracked production file
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

concurrency:
  group: toasty-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate consolidated product surfaces
        run: |
          set -euo pipefail
          node scripts/remaining-work-consolidation-test.mjs

      - name: Validate live Studio stability
        run: |
          set -euo pipefail
          node scripts/live-studio-stability-test.mjs

      - name: Run Studio release gate
        run: |
          set -euo pipefail
          node scripts/studio-release-gate.mjs

      - name: Validate onboarding and End Session
        run: |
          set -euo pipefail
          node scripts/onboarding-end-session-test.mjs

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOASTY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.TOASTY_SSH_HOST }}
          SSH_PORT: ${{ secrets.TOASTY_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/toasty_github_deploy
          chmod 600 ~/.ssh/toasty_github_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Determine changed deployable files
        id: changes
        run: |
          set -euo pipefail
          FILTER='^(\.htaccess$|index\.html$|site/|ricardo/|studio/|admin/|app/|experts/|peeps/|css/|js/|shared/|assets/|articles/|eloquencebonus/|thank-you\.html$|5-Day Executive Program\.pdf$|Eloquence Cheat Sheet\.pdf$|casanova_case_study\.pdf$|ricardo_casanova_resumeJune2026\.pdf$)'
          # scripts/ is intentionally excluded: this job SSHes to the LiteSpeed static host
          # (toasty.media). The canonical auth helper belongs on the Ubuntu render host
          # (render.toasty.media → 127.0.0.1:4174). Shipping Python onto the public web root
          # would not update AUTH_DB_HELPER and would publish backend source. See
          # scripts/deploy-render-helper.sh and docs/DEPLOYMENT.md.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_deploy }}" == "true" ]]; then
            git ls-files | grep -E "$FILTER" > /tmp/deploy-files.txt || true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git diff --name-only --diff-filter=ACMRT HEAD^ HEAD | grep -E "$FILTER" > /tmp/deploy-files.txt || true
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD^"; fi
            git diff --name-only --diff-filter=ACMRT "$BASE" HEAD | grep -E "$FILTER" > /tmp/deploy-files.txt || true
          fi
          echo "Files selected:"
          cat /tmp/deploy-files.txt || true
          if [[ -s /tmp/deploy-files.txt ]]; then echo 'has_files=true' >> "$GITHUB_OUTPUT"; else echo 'has_files=false' >> "$GITHUB_OUTPUT"; fi

      - name: Backup changed production files
        if: steps.changes.outputs.has_files == 'true'
        env:
          SSH_HOST: ${{ secrets.TOASTY_SSH_HOST }}
          SSH_USER: ${{ secrets.TOASTY_SSH_USER }}
          SSH_PORT: ${{ secrets.TOASTY_SSH_PORT }}
        run: |
          set -euo pipefail
          PROD_ROOT='/home/fmxgijyvpq/toasty.media'
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$PROD_ROOT/_backups/toasty-media-$STAMP"
          FILES_B64="$(base64 -w0 /tmp/deploy-files.txt)"
          ssh -i ~/.ssh/toasty_github_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "PROD_ROOT='$PROD_ROOT' BACKUP='$BACKUP' FILES_B64='$FILES_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$BACKUP"
          while IFS= read -r path; do
            if [[ -e "$PROD_ROOT/$path" ]]; then
              mkdir -p "$BACKUP/$(dirname "$path")"
              cp -a "$PROD_ROOT/$path" "$BACKUP/$path"
            fi
          done < <(printf '%s' "$FILES_B64" | base64 -d)
          REMOTE

      - name: Upload changed files
        if: steps.changes.outputs.has_files == 'true'
        env:
          SSH_HOST: ${{ secrets.TOASTY_SSH_HOST }}
          SSH_USER: ${{ secrets.TOASTY_SSH_USER }}
          SSH_PORT: ${{ secrets.TOASTY_SSH_PORT }}
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/deploy-files.txt
          git archive --format=tar HEAD -- "${FILES[@]}" | ssh -i ~/.ssh/toasty_github_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd /home/fmxgijyvpq/toasty.media && tar -xf -"

      - name: Verify production
        if: steps.changes.outputs.has_files == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://toasty.media/ >/tmp/home.html
          curl --fail --silent --show-error --location https://toasty.media/ricardo/ >/dev/null
          curl --fail --silent --show-error --location https://toasty.media/studio/ >/dev/null
          curl --fail --silent --show-error --location https://toasty.media/studio/experts.html >/tmp/guest.html
          curl --fail --silent --show-error --location https://toasty.media/admin/ >/dev/null
          curl --fail --silent --show-error --location https://toasty.media/app/ >/tmp/legacy-app.html
          curl --fail --silent --show-error --location https://toasty.media/experts/ >/tmp/legacy-experts.html
          if [[ -f peeps/index.html ]]; then
            curl --fail --silent --show-error --location https://toasty.media/peeps/ >/tmp/peeps.html
            curl --fail --silent --show-error --location https://toasty.media/peeps/app/ >/tmp/peeps-app.html
            curl --fail --silent --show-error --location https://toasty.media/peeps/app/dough.html >/tmp/dough.html
            curl --fail --silent --show-error --location https://toasty.media/peeps/manage/ >/dev/null
            grep -Fq 'Find your' /tmp/peeps.html
            grep -Fq 'peeps-public-auth.js' /tmp/peeps.html
            if grep -Fq 'peeps-app-gated' /tmp/peeps.html; then echo 'Public /peeps/ must not load the app auth gate' >&2; exit 1; fi
            grep -Fq 'peeps-app-gate.js' /tmp/peeps-app.html
            grep -Fq 'peeps-app-gated' /tmp/peeps-app.html
            grep -Fq 'peeps-app-gate.js' /tmp/dough.html
            grep -Fq 'Money for knowledge.' /tmp/dough.html
          fi
          grep -Fq 'Studio to create.' /tmp/home.html
          grep -Fq 'Who do you want to talk to?' /tmp/guest.html
          echo 'Production verification passed.'
