name: Fetch real soundboard SFX

on:
  push:
    paths:
      - .github/workflows/fetch-real-sfx.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Replace synthetic pads with real recorded audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/toasty-sfx assets/catalogue/audio

          fetch_convert () {
            name="$1"
            url="$2"
            ext="$3"
            echo "Fetching $name"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "/tmp/toasty-sfx/$name.$ext"
            ffmpeg -hide_banner -loglevel error -y               -i "/tmp/toasty-sfx/$name.$ext" -ar 48000 -ac 2               "assets/catalogue/audio/$name.wav"
          }

          # Actual human attention/street whistle. OwlStorm CC0 recording.
          fetch_convert "cholo-whistle-01"             "https://raw.githubusercontent.com/steelbeowulf/Guild/master/Assets/SFX/320140__owlstorm__attention-whistle.wav" wav

          # Actual cash register purchase / cha-ching. Zott820 CC0 recording.
          fetch_convert "cha-ching-01"             "https://raw.githubusercontent.com/StrawWagen/hunters_glee/main/sound/hunters_glee/209578_zott820_cash-register-purchase.wav" wav

          # Actual paper rustle. BenjaminNelan CC0 recording.
          fetch_convert "paper-rustle-01"             "https://raw.githubusercontent.com/HectorVilas/odin-tic-tac-toe/main/media/sounds/paper/353125__benjaminnelan__paper-rustle.wav" wav

          # Actual prepared CC0 camera shutter derived from roachpowder Freesound #170229.
          fetch_convert "camera-shutter-01"             "https://raw.githubusercontent.com/Tombonator3000/SIGNAL-47/main/Unity/Assets/Signal47/Art/ThirdParty/PreparedAudio/CameraShutter.wav" wav

          # Real mouse click sample derived from Six Ways / Freesound #223445.
          fetch_convert "mouse-click-01"             "https://raw.githubusercontent.com/phuclh/omarchy-typetone/main/mouse-sounds/crisp/left.wav" wav

          # Real vine-boom style sample already distributed in an open-source soundboard.
          fetch_convert "bass-boom-01"             "https://raw.githubusercontent.com/ernestgwilsonii/Soundboard/main/app/static/demo_sounds/vine_boom.mp3" mp3

          # Real recorded bottle pop, CC0.
          fetch_convert "pop-01"             "https://raw.githubusercontent.com/collindeel/the-hand-that-feeds-you/main/Assets/Audio/SoundFX/bottle_pop.wav" wav

          # Real human scream/FAHH-type recording from the same CC0-attributed pack.
          fetch_convert "fah-01"             "https://raw.githubusercontent.com/collindeel/the-hand-that-feeds-you/main/Assets/Audio/SoundFX/scream_3.mp3" mp3

          # Real human whistle alternative from that CC0-attributed pack, used for Rider.
          fetch_convert "rider-01"             "https://raw.githubusercontent.com/collindeel/the-hand-that-feeds-you/main/Assets/Audio/SoundFX/whistle.mp3" mp3

          # Real recordings/produced effects already in Toasty's licensed catalogue.
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/record-scratch-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/glitch-01.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/impact-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/core-hit-01.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/impact-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/bass-impact-01.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/whoosh-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/metallic-riser-01.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/record-scratch-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/fast-forward-01.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/ding-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/click-01.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/catalogue/audio/success-chime-01.ogg -ar 48000 -ac 2 assets/catalogue/audio/space-alert-01.wav

      - name: Commit real sound files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogue/audio/*.wav
          if git diff --cached --quiet; then
            echo "No audio changes"
            exit 0
          fi
          git commit -m "Replace synthetic soundboard pads with real recorded SFX"
          git push
