name: Fetch real soundboard SFX

on:
  push:
    paths:
      - .github/workflows/fetch-real-sfx.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real SFX from Pixabay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, subprocess, urllib.request
          from pathlib import Path

          UA={"User-Agent":"Mozilla/5.0"}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              return urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")

          def detail_from_search(url):
              body=get(url)
              links=re.findall(r'href="([^"]*/sound-effects/[^"]+-\d+/)"',body)
              if not links:
                  raise RuntimeError("No detail link: "+url)
              link=html.unescape(links[0])
              if link.startswith("/"):
                  link="https://pixabay.com"+link
              return link

          def audio_url(page):
              body=get(page)
              patterns=[
                  r'https://cdn\.pixabay\.com/download/audio/[^"\'<> ]+?\.mp3[^"\'<> ]*',
                  r'https://cdn\.pixabay\.com/audio/[^"\'<> ]+?\.mp3[^"\'<> ]*'
              ]
              for pat in patterns:
                  m=re.search(pat,body)
                  if m:
                      return html.unescape(m.group(0)).replace("\\u0026","&")
              raise RuntimeError("No audio URL: "+page)

          sources={
            "cholo-whistle-01.wav":"https://pixabay.com/sound-effects/people-attention-whistle-103707/",
            "cha-ching-01.wav":"https://pixabay.com/sound-effects/cash-register-purchase-87313/",
            "camera-shutter-01.wav":"https://pixabay.com/sound-effects/technology-camera-shutter-click-14671/",
            "mouse-click-01.wav":"https://pixabay.com/sound-effects/film-special-effects-mouse-click-sound-37582/",
            "fast-forward-01.wav":"https://pixabay.com/sound-effects/film-special-effects-fast-forward-5980/",
            "glitch-01.wav":"https://pixabay.com/sound-effects/film-special-effects-glitch-sound-effect-96251/",
            "paper-rustle-01.wav":"SEARCH:https://pixabay.com/sound-effects/search/paper%20rustle/",
            "bass-impact-01.wav":"SEARCH:https://pixabay.com/sound-effects/search/bass%20impact/",
            "bass-boom-01.wav":"SEARCH:https://pixabay.com/sound-effects/search/vine%20boom/",
            "pop-01.wav":"SEARCH:https://pixabay.com/sound-effects/search/pop%20sound%20effect/",
            "metallic-riser-01.wav":"SEARCH:https://pixabay.com/sound-effects/search/metallic%20rise/"
          }
          out=Path("assets/catalogue/audio")
          out.mkdir(parents=True,exist_ok=True)
          for name,page in sources.items():
              if page.startswith("SEARCH:"):
                  page=detail_from_search(page[7:])
              src=audio_url(page)
              mp3=Path("/tmp")/(name+".mp3")
              req=urllib.request.Request(src,headers=UA)
              mp3.write_bytes(urllib.request.urlopen(req,timeout=60).read())
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(mp3),"-ar","48000","-ac","2",str(out/name)],check=True)
              print(name,page,src)
          PY
      - name: Commit real sound files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogue/audio/*.wav
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace synthetic pads with real recorded sound effects"
          git push
