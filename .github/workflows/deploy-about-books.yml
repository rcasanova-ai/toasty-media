name: Deploy Toasty About and Books
on:
  push:
    branches: [main]
    paths:
      - 'about/**'
      - 'books/**'
      - 'site/assets/images/books/**'
      - 'css/about-page.css'
      - 'shared/brand/clients/optimai/**'
      - '.github/workflows/deploy-about-books.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toasty-about-books-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOASTY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.TOASTY_SSH_HOST }}
          SSH_PORT: ${{ secrets.TOASTY_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/toasty_github_deploy
          chmod 600 ~/.ssh/toasty_github_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Back up and deploy only About and Books assets
        env:
          SSH_HOST: ${{ secrets.TOASTY_SSH_HOST }}
          SSH_USER: ${{ secrets.TOASTY_SSH_USER }}
          SSH_PORT: ${{ secrets.TOASTY_SSH_PORT }}
        run: |
          set -euo pipefail
          ROOT=/home/fmxgijyvpq/toasty.media
          DEST="$SSH_USER@$SSH_HOST"
          SSH=(ssh -i ~/.ssh/toasty_github_deploy -p "$SSH_PORT")
          "${SSH[@]}" "$DEST" "set -e; ROOT='$ROOT'; BACKUP=\"\$ROOT/_backups/about-books-\$(date +%Y%m%d-%H%M%S)\"; mkdir -p \"\$BACKUP\"; for p in about books css/about-page.css shared/brand/clients/optimai site/assets/images/books; do if [ -e \"\$ROOT/\$p\" ]; then mkdir -p \"\$BACKUP/\$(dirname \"\$p\")\"; cp -a \"\$ROOT/\$p\" \"\$BACKUP/\$p\"; fi; done"
          git archive --format=tar HEAD -- about books css/about-page.css shared/brand/clients/optimai site/assets/images/books | "${SSH[@]}" "$DEST" "cd '$ROOT' && tar -xf -"
      - name: Verify live pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://toasty.media/about/' -o /tmp/about.html
          curl --fail --silent --show-error --location 'https://toasty.media/books/' -o /tmp/books.html
          curl --fail --silent --show-error --location 'https://toasty.media/shared/brand/clients/optimai/logo.svg' -o /tmp/optimai.svg
          grep -Fq 'Phyll &amp; Wisp' /tmp/about.html
          grep -Fq 'Phyll &amp; Wisp' /tmp/books.html
          grep -Fq 'optimai/logo.svg' /tmp/about.html
          grep -Fq '<svg' /tmp/optimai.svg
          curl --fail --silent --show-error --location 'https://toasty.media/site/assets/images/books/Phyll-and-Wisp-Meet-AI-Front-Cover-PROMO.png' -o /tmp/phyll-cover.png
          test $(wc -c < /tmp/phyll-cover.png) -gt 1000
