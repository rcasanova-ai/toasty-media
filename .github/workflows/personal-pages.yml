name: Publish personal pages
on:
  push:
    branches: [main]
    paths:
      - 'resume/**'
      - 'contact/**'
      - 'about/**'
      - 'ponderings/**'
      - 'speaking/**'
      - '.github/workflows/personal-pages.yml'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site pages
        env:
          SSH_HOST: ${{ secrets.TOASTY_SSH_HOST }}
          SSH_PORT: ${{ secrets.TOASTY_SSH_PORT }}
          SSH_USER: ${{ secrets.TOASTY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.TOASTY_SSH_PRIVATE_KEY }}
        run: bash scripts/publish-personal-pages.sh

# Publishing pipeline for existing Spaceship hosting.
