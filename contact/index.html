<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Ricardo Casanova | Toasty Media</title><meta name="description" content="Get in touch with Ricardo Casanova about partnerships, speaking, creative projects or interesting ideas."><link rel="icon" href="../shared/brand/toasty-media/ToastyTransparent.png"><link rel="stylesheet" href="../css/toasty-site.css"><style>.contact-wrap{max-width:750px;margin:0 auto;padding:80px 20px 110px}.contact-wrap h1{font:normal clamp(3rem,8vw,5.6rem)/1.05 Georgia,serif;margin:.2em 0}.contact-wrap p{line-height:1.7}.contact-form{display:grid;gap:18px;margin-top:35px}.contact-form label{display:grid;gap:7px;font-weight:600}.contact-form input,.contact-form select,.contact-form textarea{background:#191715;color:#f8f1ea;border:1px solid #75665a;border-radius:9px;padding:13px;font:inherit;width:100%;box-sizing:border-box}.contact-form textarea{min-height:160px;resize:vertical}.contact-form .check{display:flex;gap:12px;font-weight:400}.contact-form .check input{width:auto;align-self:start;margin-top:6px}.hp{position:absolute;left:-9999px}#status[data-error=true]{color:#ffc4aa}#status[data-success=true]{color:#bff2ca}</style></head><body class="ts"><header class="ts-nav"><div class="ts-wrap ts-nav__bar"><a class="ts-brand" href="../"><img src="../shared/brand/toasty-media/ToastyTransparent.png" alt=""><span>Toasty Media</span></a><nav class="ts-nav__links"><a href="../about/">About</a><a href="../resume/">Resume</a><a href="../ponderings/">Ponderings</a></nav></div></header><main class="contact-wrap"><p class="ts-eyebrow">Contact Ricardo</p><h1>Have something <em>interesting?</em></h1><p class="ts-lede">Business opportunities, speaking invitations, creative projects, a good argument or just an interesting idea. Send me a message.</p><form class="contact-form" id="contactForm">
<label>Your name<input name="name" required maxlength="120" autocomplete="name"></label>
<label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email"></label>
<label>What's this about?<select name="subject" required><option value="">Choose one</option><option>Business or partnership</option><option>Speaking or media</option><option>Toasty or podcast</option><option>Something interesting</option><option>Other</option></select></label>
<label>Your message<textarea name="message" required maxlength="5000" minlength="10"></textarea></label>
<label class="hp" aria-hidden="true">Leave blank<input name="website" tabindex="-1" autocomplete="off"></label>
<label class="check"><input type="checkbox" name="consent" required><span>It's okay to use my details to reply to this message. No marketing subscription.</span></label>
<button class="ts-btn ts-btn--primary" id="send" type="submit">Send message</button><p id="status" role="status" aria-live="polite"></p></form></main><footer class="ts-footer"><div class="ts-wrap ts-footer__grid"><span>© Toasty Media</span><a href="../about/">About</a></div></footer><script type="module">
import { studioApiEndpoint } from '../js/studio-api.js';
const f=document.getElementById('contactForm'),status=document.getElementById('status'),btn=document.getElementById('send'),start=Date.now();
f.addEventListener('submit',async event=>{event.preventDefault();if(!f.reportValidity())return;const d=new FormData(f);btn.disabled=true;status.textContent='Sending...';status.dataset.error='false';status.dataset.success='false';
try{const r=await fetch(studioApiEndpoint()+'/api/organizations/personal-contact',{method:'POST',headers:{'Content-Type':'application/json','X-Toasty-CSRF':'1'},body:JSON.stringify({name:d.get('name'),email:d.get('email'),subject:d.get('subject'),message:d.get('message'),consent:d.get('consent')==='on',website:d.get('website'),elapsedMs:Date.now()-start})});const response=await r.json().catch(()=>({}));if(!r.ok)throw Error(response.error||'Message could not be sent.');if(response.ok!==true)throw Error('Message delivery was not confirmed.');status.textContent='Your message has been sent. Thank you!';status.dataset.success='true';f.reset();}catch(e){status.textContent=e.message||'Unable to send your message.';status.dataset.error='true';}finally{btn.disabled=false}});
</script><script defer src="/js/wisp-research.js?v=wisp-20261028"></script></body></html>
